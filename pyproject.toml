[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isitcooked"
version = "0.1.0"
description = "IsItCooked: plug in an iPhone or Android phone and find out if its battery is cooked, in one command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["rich>=13.0"]
keywords = ["isitcooked", "iphone", "android", "battery", "cycle-count", "adb", "libimobiledevice"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
isitcooked = "isitcooked.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
